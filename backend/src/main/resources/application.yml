spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-request-size: 64KB
      max-file-size: 64KB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  reset-url: ${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
  mail-from: ${MAIL_FROM:no-reply@scamshield.local}
  scan-retention-days: ${SCAN_RETENTION_DAYS:90}
  login-attempt-limit: ${LOGIN_ATTEMPT_LIMIT:10}
  login-window-minutes: ${LOGIN_WINDOW_MINUTES:15}
firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  database-id: ${FIRESTORE_DATABASE_ID:(default)}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:${GOOGLE_APPLICATION_CREDENTIALS:}}